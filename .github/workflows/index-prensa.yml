name: Index press archive

# El archivo de prensa se mantiene como catálogo curado. La extracción desde
# Medium puede bloquear runners automatizados, por lo que este workflow no se
# ejecuta en cada push ni reemplaza automáticamente los archivos publicados.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-indexer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run indexer in validation mode
        run: |
          python scripts/index_prensa.py || true
          echo "Validation only: generated files are not committed automatically."
