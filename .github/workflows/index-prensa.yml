name: Validate press archive

on:
  workflow_dispatch:
  push:
    paths:
      - "archivo/prensa/prensa.csv"
      - "scripts/index_prensa.py"
      - ".github/workflows/index-prensa.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate curated press archive
        run: python scripts/index_prensa.py
