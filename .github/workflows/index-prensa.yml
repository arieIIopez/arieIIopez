name: Index press archive

on:
  push:
    paths:
      - "scripts/index_prensa.py"
      - "archivo/prensa/fuentes.yml"
      - ".github/workflows/index-prensa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Build press index
        run: python scripts/index_prensa.py

      - name: Show state
        run: cat archivo/prensa/estado.json

      - name: Commit generated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archivo/prensa/index.md archivo/prensa/prensa.csv archivo/prensa/estado.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update press archive index"
            git push
          fi
