name: Sync YouTube press playlist

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync_youtube_prensa.py"
      - ".github/workflows/sync-youtube-prensa.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Enumerate playlist and cross-match press archive
        run: python scripts/sync_youtube_prensa.py
      - name: Validate press archive
        run: python scripts/index_prensa.py
      - name: Commit generated catalog changes
        run: |
          if git diff --quiet -- archivo/prensa/prensa.csv archivo/prensa/index.md archivo/prensa/youtube_playlist.csv archivo/prensa/youtube_match_report.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archivo/prensa/prensa.csv archivo/prensa/index.md archivo/prensa/youtube_playlist.csv archivo/prensa/youtube_match_report.md
          git commit -m "Sync press archive with YouTube playlist"
          git push
